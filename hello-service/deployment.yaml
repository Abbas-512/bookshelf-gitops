apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-service
  labels:
    app.kubernetes.io/name: hello-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-service
    spec:
      containers:
        - name: hello-service
          image: hello-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
